services:
  cuidarteplus-postgres-ev:
    image: postgres:15-alpine
    container_name: cuidarteplus-postgres-ev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cuidarteplus}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PORT_POSTGRES:-15442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/sql/dump-cuidarteplus.sql:/tmp/dump-cuidarteplus.sql:ro
      - ./BACKEND/sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cuidarteplus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cuidarteplus-network
    restart: unless-stopped

  cuidarteplus-backend-ev:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: cuidarteplus-backend-ev
    hostname: cuidarteplus-api
    environment:
      - PORT=4444
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@cuidarteplus-postgres-ev:5432/${POSTGRES_DB:-cuidarteplus}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - FRONTEND_URL=http://${EC2_PUBLIC_IP:-18.209.247.121}:${PORT_FRONTEND:-3333}
    ports:
      - "${PORT_BACKEND:-4444}:4444"
    depends_on:
      cuidarteplus-postgres-ev:
        condition: service_healthy
    volumes:
      - ./BACKEND/uploads:/app/uploads
    networks:
      - cuidarteplus-network
    restart: unless-stopped

  cuidarteplus-frontend-ev:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://${EC2_PUBLIC_IP:-18.209.247.121}:${PORT_BACKEND:-4444}"
    container_name: cuidarteplus-frontend-ev
    hostname: cuidarteplus-web
    ports:
      - "${PORT_FRONTEND:-3333}:80"
    depends_on:
      - cuidarteplus-backend-ev
    networks:
      - cuidarteplus-network
    restart: unless-stopped

  # ==========================================
  # NUEVOS SERVICIOS: SONARQUBE LTS + DB PROPIA
  # ==========================================
  sonarqube:
    image: sonarqube:lts-community
    container_name: cuidarteplus-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "${PORT_SONARQUBE:-9000}:9000"
    networks:
      - cuidarteplus-network
    environment:
      - SONAR_JDBC_USERNAME=${SONAR_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${SONAR_PASSWORD:-sonar_secure_pass_123}
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    networks:
      - cuidarteplus-network
    environment:
      - POSTGRES_USER=${SONAR_USER:-sonar}
      - POSTGRES_PASSWORD=${SONAR_PASSWORD:-sonar_secure_pass_123}
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_USER:-sonar} -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  # Nuevos volúmenes para persistir SonarQube
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db_data:

networks:
  cuidarteplus-network:
    driver: bridge
    name: cuidarteplus-network
